<!doctype html>
<html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Accessibility and performance fixture</title>
<style>
  body { margin: 0; font: 16px/1.6 sans-serif; color: #111; background: #fff; }
  main { padding: 16px; }
  .faint { color: #bbb; }
  .hero { font-size: 28px; line-height: 1.3; }
</style>
<!-- Served by tests/ui_a11y_perf_fixture_test.mjs: the HTML is delayed (slow LCP) and
     /big.js is about 700 KB (JS budget). -->
<script src="/big.js"></script>
</head>
<body><main>
  <section id="content">
    <h1 class="hero">หน้าทดสอบที่มีปัญหาการเข้าถึงและความเร็ว</h1>
    <!-- a11y: image-alt (critical) -->
    <img src="data:image/gif;base64,R0lGODlhAQABAIAAAP///wAAACH5BAEAAAAALAAAAAABAAEAAAICRAEAOw==" width="40" height="40">
    <!-- a11y: label (critical) -->
    <input type="text">
    <!-- a11y: button-name (critical) -->
    <button></button>
    <!-- a11y: color-contrast (serious) -->
    <p class="faint">ข้อความสีจางที่อ่านยาก</p>
    <p>ย่อหน้ายาวพอให้เนื้อหาเต็มจอ ย่อหน้ายาวพอให้เนื้อหาเต็มจอ ย่อหน้ายาวพอให้เนื้อหาเต็มจอ ย่อหน้ายาวพอให้เนื้อหาเต็มจอ ย่อหน้ายาวพอให้เนื้อหาเต็มจอ</p>
  </section>
</main>
<script>
  // CLS: a banner pushes the content down after it has rendered.
  setTimeout(() => {
    const banner = document.createElement("div");
    banner.style.height = "480px";
    banner.textContent = "แบนเนอร์ที่โผล่มาทีหลัง";
    document.querySelector("main").prepend(banner);
  }, 800);
  // TBT: a long task after first paint (wall-clock, so CPU throttling does not stretch it).
  setTimeout(() => { const end = performance.now() + 700; while (performance.now() < end); }, 1500);
  // INP: a slow key handler.
  document.addEventListener("keydown", () => { const end = performance.now() + 600; while (performance.now() < end); });
</script>
</body></html>
