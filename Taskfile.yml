version: "3"

tasks:
  check:
    desc: Validate every skill package (frontmatter, limits, openai metadata, README inventory) and run the tests
    cmds:
      - python3 scripts/check_skills.py
      - python3 scripts/skill_governance.py {{.CLI_ARGS}}
      - python3 tests/skill_governance_test.py
      - python3 tests/ui_review_gate_test.py
      - node --check qa-testing/scripts/ui_review.mjs
      - node --check qa-testing/scripts/ui_browsers.mjs
      - node --check qa-testing/scripts/ui_visual_diff.mjs
      - node --check qa-testing/scripts/ui_a11y_perf.mjs
      - node tests/ui_review_fixture_test.mjs
      - node tests/ui_inner_scroller_fixture_test.mjs
      - node --check ux-review/scripts/ui_states.mjs
      - node tests/ui_states_fixture_test.mjs
      - node --check qa-testing/scripts/ui_login.mjs
      - node tests/ui_login_fixture_test.mjs
      - node tests/ui_baseline_fixture_test.mjs
      - node tests/ui_cross_browser_fixture_test.mjs
      - node tests/ui_a11y_perf_fixture_test.mjs
      - node --check flow-video/scripts/flow_video.mjs
      - node tests/flow_video_fixture_test.mjs
  audit:
    desc: Full skill governance audit as JSON
    cmds:
      - python3 scripts/skill_governance.py --json
  test:
    desc: Alias of check
    cmds:
      - task: check
